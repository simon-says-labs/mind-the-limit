name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS, install and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests on Apple's /usr/bin/python3 (no Bluetooth, no Claude Code)
        run: /usr/bin/python3 -m unittest discover -s tests -t . -v
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install without the background job (real pyobjc from PyPI)
        run: |
          export MIND_THE_LIMIT_HOME="$RUNNER_TEMP/mind-the-limit"
          python -m mind_the_limit --language en install --no-agent
          "$MIND_THE_LIMIT_HOME/venv/bin/python" -c "import IOBluetooth, Foundation; print('pyobjc ok')"
          "$MIND_THE_LIMIT_HOME/mind-the-limit" --language en status
      - name: Previews in every language
        run: |
          for l in en de fr it es; do python -m mind_the_limit --language $l preview --values 23,35,0 --out "$RUNNER_TEMP/p-$l.png"; done
          python -m mind_the_limit preview --error usage --out "$RUNNER_TEMP/e.png"

  linux:
    name: Linux, current Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
